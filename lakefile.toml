name = "vinyl"
version = "0.1.0"
# `vinyl` is a default target so that `lake build` relinks the executable the
# compiled-path audit reads; leaving it out once meant measuring a stale binary.
defaultTargets = ["Flac", "FlacTest", "flactest", "vinyl"]
# Link-time optimisation across the generated C units (+7% encode, +2% decode,
# output byte-identical) and `-fno-math-errno`, which lets clang inline `floor`
# in the float search (+3% encode; no code here reads errno). Package-wide, so
# every module's C is bitcode and the executables link with LTO.
moreLeancArgs = ["-flto", "-fno-math-errno"]
moreLinkArgs = ["-flto", "-fno-math-errno"]

[[lean_lib]]
name = "Flac"

[[lean_lib]]
name = "FlacTest"

[[lean_exe]]
name = "flactest"
root = "FlacTest.Main"

[[lean_exe]]
name = "vinyl"
root = "Vinyl"
